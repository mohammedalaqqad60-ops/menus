  if(l)l.q++;else cart.push({c:c,i:i,s:s,n:n,q:1});upd();
}
function tot(){var n=0,s=0;cart.forEach(function(l){n+=l.q;s+=l.q*C[l.c].it[l.i].p});return[n,s]}
function upd(){var r=tot();$("cb").style.display=r[0]?"flex":"none";$("cn").textContent=t("طلبي")+" ("+r[0]+")";$("ct").textContent=fm(r[1])+" "+cur()}
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)cart.splice(k,1);upd();cart.length?ord():hide()}
function ord(){
  var h='<h3>طلبي</h3>';
  cart.forEach(function(l,k){var x=C[l.c].it[l.i];h+='<div class="row"><div>'+nm(x)+'<small>'+[l.s,l.n].filter(Boolean).join(" · ")+'</small></div><button onclick="chg('+k+',-1)">−</button><b>'+l.q+'</b><button onclick="chg('+k+',1)">+</button><button class="rm" onclick="chg('+k+',-'+l.q+')">حذف</button></div>'});
  show(h+'<input id="tb" inputmode="numeric" placeholder="رقم الطاولة" value="'+tbl+'" oninput="tbl=this.value"><div class="tot"><span>الإجمالي</span><span>'+fm(tot()[1])+' د.أ</span></div><button class="pb" onclick="cp()">نسخ الطلب لإعطائه للويتر</button><button class="sb" onclick="hide()">إغلاق</button><button class="sb cx" onclick="cc()">إلغاء الطلب</button>');
}
function cc(){show('<h3>متأكد بدك تلغي الطلب كامل؟</h3><button class="sb cx" onclick="cc2()">نعم، ألغِ الطلب</button><button class="sb" onclick="ord()">رجوع</button>')}
function cc2(){cart=[];tbl="";upd();hide()}
function cp(){
  var tt=(tbl?"طاولة "+tbl+"\n":"")+cart.map(function(l){var x=C[l.c].it[l.i];return l.q+"× "+x.a+([l.s,l.n].filter(Boolean).length?" ("+[l.s,l.n].filter(Boolean).join("، ")+")":"")}).join("\n")+"\nالمجموع: "+fm(tot()[1])+" د.أ";
  try{navigator.clipboard.writeText(tt);alert(t("تم نسخ الطلب"))}catch(e){alert(tt)}
}
$("cb").onclick=ord;
function rnd(){
  var a=[];C.forEach(function(c,ci){if(ci<7||ci==8)c.it.forEach(function(x,ii){if(x.f!="s")a.push([ci,ii])})});
  var p=a[Math.floor(Math.random()*a.length)],x=C[p[0]].it[p[1]];
  show('<h3>اقتراحنا لك</h3><div style="text-align:center;padding:14px 0"><div class="a" style="font-size:20px">'+nm(x)+'</div><div class="e" style="text-align:center">'+sb(x)+'</div><div class="r"><b style="font-size:24px">'+fm(x.p)+'</b> <small>د.أ</small></div></div><button class="pb" onclick="hide();ad('+p[0]+','+p[1]+')">أضفه لطلبي</button><button class="sb" onclick="rnd()">اقتراح ثاني</button>');
}
$("q").oninput=render;
window.addEventListener("scroll",function(){var a=-1;C.forEach(function(c,i){var e=$("c"+i);if(e&&e.getBoundingClientRect().top<170)a=i});document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",+b.dataset.i==a)})});
render();
</script>
</body>
</html>
